<!DOCTYPE html>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/konpa/devicon@df6431e323547add1b4cf45992913f15286456d3/devicon.min.css">
<html lang="en">
  {% include head.html %}
  <body>
    {% include nav.html %}

    <!-- Same id the splash hero uses, so app.js finds it and draws particles.
         The .page-hero class shrinks it; see _sass/_page.scss. -->
    <header id="particles-js" class="page-hero">
      <div class="page-hero__text">
        <h1>{{ page.title }}</h1>
        {% if page.subtitle %}<p>{{ page.subtitle }}</p>{% endif %}
      </div>
    </header>

    <main class="page-content">
      {{ content }}
    </main>

    {% include footer.html %}

    {% if page.math %}
    <script>
      window.MathJax = { tex: { tags: 'ams' } };
    </script>
    <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
    {% endif %}
  </body>
</html>
